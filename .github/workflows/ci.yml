name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Native quality and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install project and quality dependencies
        run: |
          python -m pip install --constraint constraints.txt setuptools wheel
          python -m pip install --no-build-isolation --constraint constraints.txt --editable ".[dev,ml]"
          python -m pip check

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src/motion

      - name: Smoke test native CLI
        run: |
          motion --help
          motion uc-status --json

      - name: Run offline tests with coverage
        run: |
          mkdir -p reports
          python -m pytest \
            --junitxml=reports/junit.xml \
            --cov=motion \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-reports-attempt-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container gate (${{ matrix.architecture }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            carla_client: true
          - architecture: arm64
            runner: ubuntu-24.04-arm
            carla_client: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: |
          docker compose config --quiet
          docker compose --profile test --profile carla-client config --quiet

      - name: Build MOTION runtime image
        run: docker compose build motion

      - name: Smoke test containerized CLI
        run: |
          docker compose run --rm --no-deps motion --help
          docker compose run --rm --no-deps motion uc-status --json
          docker compose run --rm --no-deps --entrypoint python motion \
            -c "import motion; print(motion.__version__)"
          docker compose run --rm --no-deps --entrypoint python motion -m pip check

      - name: Build and smoke test external CARLA client image
        if: matrix.carla_client
        run: |
          docker compose --profile carla-client build motion-carla
          docker compose --profile carla-client run --rm --no-deps \
            --entrypoint python motion-carla \
            -c "import carla, motion; print(motion.__version__)"
          docker compose --profile carla-client run --rm --no-deps \
            --entrypoint python motion-carla -m pip check

      - name: Build and run offline container tests
        run: |
          docker compose --profile test build motion-test
          docker compose --profile test run --rm --no-deps motion-test
